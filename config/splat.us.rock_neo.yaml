options:
  platform: psx
  basename: rock_neo
  base_path: ../
  target_path: disks/us/ROCK_NEO.EXE
  asm_path: asm/rock_neo
  asset_path: assets/rock_neo
  src_path: src/rock_neo
  compiler: GCC
  extensions_path: tools/splat_ext
  symbol_addrs_path: config/syms.us.rock_neo.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.us.rock_neo.txt
  undefined_syms_auto_path: config/undefined_syms_auto.us.rock_neo.txt
  find_file_boundaries: yes
  use_legacy_include_asm: no
  migrate_rodata_to_functions: no
  auto_decompile_empty_functions: no
  section_order:
    - ".rodata"
    - ".text"
    - ".data"
    # - ".sdata"
    # - ".scommon"
    # - ".bss"
    # - ".weirdassheap"
  gp_value: 0x80097864

segments:
  - [0x800, header]
  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    subalign: 4
    subsegments:
      - [0x800, rodata]
      # 0x10C0-0x113F = jtbl_800108C0/800108F0/80010920, emitted by scene.c's
      # func_8001F8DC/F9AC/FCE4 switches (cc1 .rdata) — linked from
      # scene.c.o(.rodata) in function order, not extracted. NOTE: the
      # checked-out rock_neo.ld was hand-edited to match (splat is not re-run
      # here); verify the generated ld if re-extracting.
      - [0x10C0, .rodata, scene]
      - [0x1140, rodata]
      - [0x2490, c, main]
      - [0x3BD8, c, Code800133D8]
      - [0x52C0, asm]
      - [0x5DA4, c, game]
      - [0x77D4, asm]
      - [0xA0C0, c, sound]
      - [0xBBE4, c, cd]
      - [0xE054, c, scene]
      - [0x10638, asm]           # splits to 10638.s (up to 0x1F9C4)
      - [0x1F9C4, c, Code8002F9C4]  # func_8002F9C4 (10 insns, phase-0 split template)
      - [0x1F9EC, asm]           # splits to 1F9EC.s (0x1F9EC to 0x21824)
      - [0x21824, c, Code80031824]  # func_80031824 (22 insns, phase-0 split)
      - [0x2187C, asm]           # splits to 2187C.s (0x2187C to 0x2C640)
      - [0x2C640, c, player]
      - [0x32A38, asm]
      - [0x43F88, c, moji]
      - [0x4C710, asm]
      - [0x4F434, c, sub_scrn]
      - [0x531E0, c, debug]
      - [0x543A8, asm]
      - [0x587F8, asm, psxsdk/code]
      - [0x70EC4, data]
      - [0x80064, sdata]
      - [0x88958, scommon]
      - [0x89258, .scommon, moji]
      - [0x89260, scommon]
      - [0x8B648, bss]
      - [0xB5E88, bin] # heap?
  - [0xC9800]
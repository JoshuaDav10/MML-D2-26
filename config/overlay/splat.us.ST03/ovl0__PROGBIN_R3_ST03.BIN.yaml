options:
  platform: psx
  basename: ST03.ovl0__PROGBIN_R3_ST03.BIN
  base_path: ../../../
  target_path: ./disks/us/CDDATA/DAT/ST03.BIN
  asm_path: asm/ST03/ovl0__PROGBIN_R3_ST03.BIN
  asset_path: assets/ST03/ovl0__PROGBIN_R3_ST03.BIN
  src_path: src/ST03/ovl0__PROGBIN_R3_ST03.BIN
  compiler: GCC
  extensions_path: tools/splat_ext
  symbol_addrs_path: config/overlay/splat.us.ST03/generated.syms.us.ovl0__PROGBIN_R3_ST03.BIN.txt
  undefined_funcs_auto_path: config/overlay/splat.us.ST03/undefined_funcs_auto.us.ovl0__PROGBIN_R3_ST03.BIN.txt
  undefined_syms_auto_path: config/overlay/splat.us.ST03/undefined_syms_auto.us.ovl0__PROGBIN_R3_ST03.BIN.txt
  find_file_boundaries: yes
  use_legacy_include_asm: no
  migrate_rodata_to_functions: no
  auto_decompile_empty_functions: no
  section_order:
    - ".rodata"
    - ".text"
    - ".data"
segments:
# ..\progbin\r3_st03.BIN
  - name: ST03_R3_ST03_0_header
    type: dashchunkheader
    start: 0x00000000
  - name: ST03_R3_ST03_0
    type: code
    start: 0x00000800
    vram: 0x80100000
    
    subalign: 4
    subsegments:
      - [0x800, rodata]
      - [0xCBC, asm]
      # 32-function run, all <=30 insns, NO rodata/jump tables in range.
      # rom = vram - 0x800FF800 (overlay constant; the main exe uses 0x8000F800).
      # first fn func_80101064 -> 0x1864; last fn func_801018F8 +0x20 -> 0x2118.
      - [0x1864, c, Code80101064]
      - [0x2118, asm]
      # 7 functions; 2 use jump tables and stay INCLUDE_ASM. Holds the two
      # 34-copy per-entity "act" trampolines.
      - [0x5340, c, Code80104B40]
      - [0x57F4, asm]
      # High-duplicate cluster: 64 functions, ZERO jump tables (so this C file
      # emits no .rodata and the "C rodata must be a text suffix" rule does not
      # bite). Contains the 14 most-copied bodies in the game -- func_80107F3C
      # alone has 144 copies across 33 archives.
      - [0x873C, c, Code80107F3C]
      - [0xAD94, asm]
      # Second high-duplicate cluster: 119 functions. 7 of them use jump tables
      # and MUST stay INCLUDE_ASM (a C file's .rodata can only be a tail of the
      # rodata section, so a C-ified switch here would shift every table).
      # Captures 10 more of the most-copied bodies, including one 8-insn body
      # that appears 6x in ST03 alone and 60x across the game.
      - [0xCB7C, c, Code8010C37C]
      - [0x13988, asm]
      - [0x14AE8, data]
  - [0x1D370]

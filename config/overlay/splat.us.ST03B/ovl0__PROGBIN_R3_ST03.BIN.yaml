segments:
# ..\progbin\r3_st03.BIN
  - name: ST03B_R3_ST03_0_header
    type: dashchunkheader
    start: 0x00000000
  - name: ST03B_R3_ST03_0
    type: code
    start: 0x00000800
    vram: 0x80100000
    
    subalign: 4
    subsegments:
      - [0x800, rodata]
      - [0xCBC, asm]
      # Mirror of ST03: the code chunk is byte-identical to ST03's, so the same
      # C matches here. rom = vram - 0x800FF800.
      - [0x1864, c, Code80101064]
      - [0x2118, asm]
      # High-duplicate cluster: 64 functions, ZERO jump tables (so this C file
      # emits no .rodata and the "C rodata must be a text suffix" rule does not
      # bite). Contains the 14 most-copied bodies in the game -- func_80107F3C
      # alone has 144 copies across 33 archives.
      - [0x873C, c, Code80107F3C]
      - [0xAD94, asm]
      - [0x14AE8, data]
  - [0x1D370]

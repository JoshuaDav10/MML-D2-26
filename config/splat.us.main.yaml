options:
  platform: psx
  basename: main
  base_path: ../
  target_path: disks/us/SLUS_006.03
  asm_path: asm/main
  asset_path: assets/main
  src_path: src/main
  compiler: GCC
  symbol_addrs_path: config/syms.us.main.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.us.main.txt
  undefined_syms_auto_path: config/undefined_syms_auto.us.main.txt
  find_file_boundaries: yes
  use_legacy_include_asm: no
  migrate_rodata_to_functions: no
  auto_decompile_empty_functions: no
  section_order:
    - ".rodata"
    - ".text"
    - ".data"

segments:
  - [0x800, header]
  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    subalign: 4
    subsegments:
      - [0x800, rodata]
      # 0x10C0-0x113F = jtbl_800108C0/800108F0/80010920, emitted by scene.c's
      # func_8001F8DC/F9AC/FCE4 switches (cc1 .rdata) — linked from
      # scene.c.o(.rodata) in function order, not extracted. NOTE: the
      # checked-out rock_neo.ld was hand-edited to match (splat is not re-run
      # here); verify the generated ld if re-extracting.
      - [0x10C0, .rodata, scene]
      - [0x1140, rodata]
      - [0xFE8, asm]
      - [0x2E24, asm, psxsdk2E24]
      - [0xAA44, asm, psxsdkAA44]
      - [0xB238, asm, psxsdkB238]
      - [0xDBB4, data]
  - [0x4A800]